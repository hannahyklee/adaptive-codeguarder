[project]
name = "adaptive-fallback"
version = "0.1.0"
description = "Adaptive-fallback experiment on top of CodeGuarder (CCS'25): drop a retrieved example when an LLM judge flags it as unsafe relative to the retrieved security knowledge, instead of always keeping it alongside advisory text."
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib",
    "openai==1.58.1",
    "tqdm",
]

