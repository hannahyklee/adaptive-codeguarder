[tool.uv]
# codebleu==0.7.0 declares tree-sitter~=0.22, but that core version is
# incompatible with the newer per-language grammar wheels (tree-sitter-c
# etc.) needed for macOS arm64 wheel availability -- codebleu's own
# Language(grammar.language()) call breaks against tree-sitter==0.22.3
# because newer grammar wheels return a different object from .language().
# codebleu's code itself doesn't care what version it declared, only
# whether the runtime API call works, so force a newer core here.
override-dependencies = ["tree-sitter>=0.24"]

# Deliberately excluded from environment.yml's pip list: nvidia-cuda-*,
# nvidia-cublas-cu12, nvidia-cudnn-cu12, etc., and triton -- these are
# Linux+CUDA-GPU-only wheels (the original artifact was built on Linux with
# an NVIDIA GPU; see environment.yml's "prefix: /home/bo/miniconda3/envs/..."),
# unavailable and unnecessary on macOS/CPU or non-CUDA setups. torch installs
# its own appropriate backend for the current platform without them.
