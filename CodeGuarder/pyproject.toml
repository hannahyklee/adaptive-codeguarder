    "click-option-group==0.5.7",
    "codebleu==0.7.0",
    "colorama==0.4.6",
    "dataclasses-json==0.6.7",
    "distro==1.9.0",
    "einops==0.8.1",
    "face==24.0.0",
    "faiss-cpu==1.12.0",
    "frozenlist==1.7.0",
    "fsspec==2025.7.0",
    "glom==22.1.0",
    "hf-xet==1.1.8",
    "httpx-sse==0.4.1",
    "huggingface-hub==0.34.4",
    "invoke==2.2.0",
