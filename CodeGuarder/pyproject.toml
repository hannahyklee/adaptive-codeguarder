[project]
name = "codeguarder"
version = "0.1.0"
description = "CCS'25 CodeGuarder artifact (vendored). This pyproject.toml is not part of the original artifact -- it's an uv-based alternative to environment.yml/conda for machines without conda installed. See VENDORED.md and CybersecurityBenchmarks/VENDORED.md."
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.12.15",
    "aiosignal==1.4.0",
    "async-lru==2.0.5",
    "async-timeout==4.0.3",
